<!doctype html>
<html>
<head>
  <style>
    #scene-04 {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060810;
      position: relative;
      overflow: hidden;
    }

    .s4-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #060810;
      z-index: 0;
    }

    .s4-dot-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(57,255,20,0.12) 0%, transparent 70%),
                 repeating-radial-gradient(circle, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 24px, transparent 24px, transparent 48px);
      background-size: 48px 48px;
      opacity: 0.28;
      z-index: 1;
    }

    .s4-corner-brackets {
      position: absolute;
      width: 56px;
      height: 56px;
      border: 3px solid rgba(255,255,255,0.5);
      z-index: 1;
    }

    .s4-corner-brackets.top-left {
      top: 0;
      left: 0;
    }

    .s4-corner-brackets.top-right {
      top: 0;
      right: 0;
    }

    .s4-corner-brackets.bottom-left {
      bottom: 0;
      left: 0;
    }

    .s4-corner-brackets.bottom-right {
      bottom: 0;
      right: 0;
    }

    .s4-scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(transparent 50%, rgba(255,255,255,0.04) 50%),
                 linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.04) 50%);
      background-size: 100% 2px, 2px 100%;
      opacity: 0.04;
      z-index: 1;
    }

    .s4-badge {
      background: #39FF14;
      color: #060810;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 28px;
      text-align: center;
      display: inline-block;
      position: relative;
      z-index: 2;
      box-shadow: 0 0 12px #39FF14;
      text-shadow: 0 0 8px #39FF14;
    }

    .s4-arrow {
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #39FF14;
      margin: 0 20px;
      z-index: 2;
    }

    .s4-time {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 20px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      z-index: 2;
    }

    .s4-pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="scene-04" data-composition-id="scene-04" data-width="1920" data-height="1080">
    <div class="s4-bg"></div>
    <div class="s4-dot-grid"></div>
    <div class="s4-corner-brackets top-left"></div>
    <div class="s4-corner-brackets top-right"></div>
    <div class="s4-corner-brackets bottom-left"></div>
    <div class="s4-corner-brackets bottom-right"></div>
    <div class="s4-scanlines"></div>
    <div class="s4-badge clip" id="step1" data-start="0.3" data-duration="3.4">NHẬP YÊU CẦU</div>
    <div class="s4-arrow clip" id="arrow1" data-start="0.8" data-duration="3.4">→</div>
    <div class="s4-badge clip" id="step2" data-start="1.2" data-duration="3.4">VIẾT XONG</div>
    <div class="s4-time clip" id="time" data-start="1.5" data-duration="3.4">10 GIÂY</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Entrance animations
    tl.from("#step1", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.3);
    tl.from("#arrow1", { x: -30, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.8);
    tl.from("#step2", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.2);
    tl.from("#time", { y: 15, opacity: 0, duration: 0.3, ease: "power2.out" }, 1.5);

    // Focal moment animation
    tl.to("#step2", { scale: 1.05, duration: 0.2, ease: "power2.inOut" }, 1.8);
    tl.to("#time", { scale: 1.1, duration: 0.2, ease: "power2.inOut" }, 1.8);

    window.__timelines["scene-04"] = tl;
  </script>
</body>
</html>
