<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene 02</title>
    <style>
      /* RESET & BASE */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #060810;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      /* SCENE CONTAINER */
      #scene-02 {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #060810;
        overflow: hidden;
        color: #ffffff;
      }

      /* BACKGROUND DECORATIONS */
      .s2-dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(57, 255, 20, 0.28) 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        z-index: 1;
      }

      .s2-radial-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 65%);
        z-index: 2;
      }

      .s2-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.3) 2px,
          rgba(0, 0, 0, 0.3) 4px
        );
        opacity: 0.04;
        pointer-events: none;
        z-index: 3;
      }

      .s2-bracket {
        position: absolute;
        width: 56px;
        height: 56px;
        border-color: rgba(57, 255, 20, 0.5);
        border-style: solid;
        border-width: 0;
        z-index: 4;
      }
      .s2-br-tl {
        top: 40px;
        left: 40px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      .s2-br-tr {
        top: 40px;
        right: 40px;
        border-top-width: 3px;
        border-right-width: 3px;
      }
      .s2-br-bl {
        bottom: 40px;
        left: 40px;
        border-bottom-width: 3px;
        border-left-width: 3px;
      }
      .s2-br-br {
        bottom: 40px;
        right: 40px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }

      /* MAIN CONTENT WRAPPER */
      .s2-content-wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 60px;
        z-index: 10;
        width: 100%;
      }

      /* COLUMNS */
      .s2-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 360px;
        padding: 60px 40px;
        background: rgba(57, 255, 20, 0.12);
        border: 1px solid rgba(57, 255, 20, 0.4);
        border-radius: 20px;
        position: relative;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* HEADER STYLES */
      .s2-hdr {
        font-family: 'Exo 2', sans-serif;
        font-weight: 800;
        font-size: 100px;
        line-height: 1.1;
        color: #39ff14;
        text-align: center;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
        margin-bottom: 40px;
      }

      /* CONTENT TEXT STYLES */
      .s2-body {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 72px;
        line-height: 1.2;
        color: #ffffff;
        text-align: center;
        letter-spacing: -1px;
        opacity: 0.9;
      }

      /* DIVIDER LINE */
      .s2-divider {
        position: absolute;
        top: 200px;
        bottom: 200px;
        left: 540px;
        width: 1px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(57, 255, 20, 0.6) 20%,
          rgba(57, 255, 20, 0.6) 80%,
          transparent
        );
        z-index: 5;
      }

      /* CAPTION AREA */
      .s2-caption-container {
        position: absolute;
        bottom: 120px;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 20;
      }

      .s2-caption-pill {
        display: inline-block;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(57, 255, 20, 0.3);
        border-radius: 16px;
        padding: 24px 56px;
        opacity: 0;
      }

      .s2-caption-text {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 48px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.3;
      }

      /* ANIMATION STATES */
      .clip {
        opacity: 0;
      }

      @media (max-width: 600px) {
        .s2-hdr { font-size: 60px; }
        .s2-body { font-size: 40px; }
        .s2-col { width: 260px; padding: 40px 20px; }
        .s2-content-wrap { gap: 20px; }
        .s2-caption-text { font-size: 32px; }
        .s2-caption-pill { padding: 16px 32px; }
      }
    </style>
  </head>
  <body>
    <div id="scene-02" data-composition-id="scene-02" data-width="1080" data-height="1920" data-duration="4.01">
      <!-- Background Layers -->
      <div class="s2-dot-grid clip"></div>
      <div class="s2-radial-glow clip"></div>
      <div class="s2-scanlines clip"></div>

      <!-- Corner Brackets -->
      <div class="s2-bracket s2-br-tl clip"></div>
      <div class="s2-bracket s2-br-tr clip"></div>
      <div class="s2-bracket s2-br-bl clip"></div>
      <div class="s2-bracket s2-br-br clip"></div>

      <!-- Center Divider -->
      <div class="s2-divider clip"></div>

      <!-- Main Content Wrapper -->
      <div class="s2-content-wrap">
        <!-- Left Column -->
        <div class="s2-col s2-col-left clip">
          <h2 class="s2-hdr s2-hdr-left">THUÊ NGƯỜI</h2>
          <p class="s2-body s2-body-left">tốn<br/>triệu</p>
        </div>

        <!-- Right Column -->
        <div class="s2-col s2-col-right clip">
          <h2 class="s2-hdr s2-hdr-right">TỰ VIẾT</h2>
          <p class="s2-body s2-body-right">kiệt<br/>sức</p>
        </div>
      </div>

      <!-- Bottom Caption -->
      <div class="s2-caption-container">
        <div class="s2-caption-pill clip">
          <span class="s2-caption-text" id="caption-text"></span>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // 1. Ambient BG entrances
        tl.fromTo(".s2-dot-grid", 
          { opacity: 0, scale: 1.1 }, 
          { opacity: 1, scale: 1, duration: 2, ease: "power2.out" }, 
          0
        );
        
        tl.fromTo(".s2-radial-glow", 
          { opacity: 0 }, 
          { opacity: 1, duration: 1.5, ease: "power2.out" }, 
          0.2
        );

        tl.fromTo(".s2-scanlines", 
          { opacity: 0 }, 
          { opacity: 1, duration: 1, ease: "none" }, 
          0.2
        );

        // Corner brackets fade in
        tl.fromTo(".s2-bracket", 
          { opacity: 0, scale: 0.8 }, 
          { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(2)", stagger: 0.1 }, 
          0.3
        );

        // Divider fade/scale
        tl.fromTo(".s2-divider", 
          { opacity: 0, scaleY: 0 }, 
          { opacity: 1, scaleY: 1, duration: 0.6, ease: "power2.out" }, 
          0.5
        );

        // 2. Main Columns Entrance (Slide in from sides)
        // Left column slides from left
        tl.fromTo(".s2-col-left", 
          { x: -300, opacity: 0 }, 
          { x: 0, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 
          0.2
        );

        // Right column slides from right
        tl.fromTo(".s2-col-right", 
          { x: 300, opacity: 0 }, 
          { x: 0, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 
          0.2
        );

        // 3. Headers Snap In (0.3s delay after columns)
        tl.fromTo(".s2-hdr-left", 
          { y: 40, scale: 0.8, opacity: 0 }, 
          { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 
          0.5
        );

        tl.fromTo(".s2-hdr-right", 
          { y: 40, scale: 0.8, opacity: 0 }, 
          { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 
          0.5
        );

        // 4. Body Text Fade Up
        tl.fromTo(".s2-body-left", 
          { y: 30, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 
          0.6
        );

        tl.fromTo(".s2-body-right", 
          { y: 30, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 
          0.6
        );

        // 5. Focal Moment: Pulse at 1.5s
        tl.to(".s2-col-left, .s2-col-right", 
          { scale: 1.04, y: -10, duration: 0.15, ease: "power1.inOut", yoyo: true, repeat: 1 }, 
          1.5
        );

        // 6. Caption Appearance (Syncing roughly with VO beats)
        tl.set("#caption-text", { textContent: "Thuê người tốn triệu…" }, 0.8);
        tl.to(".s2-caption-pill", 
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, 
          0.9
        );

        tl.to("#caption-text", { textContent: "…hoặc tự viết kiệt sức?", duration: 0.1 }, 2.0);
        
        tl.to(".s2-caption-pill", 
          { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" }, 
          3.2
        );

        // Register timeline
        window.__timelines["scene-02"] = tl;
      </script>
    </div>
  </body>
</html>
