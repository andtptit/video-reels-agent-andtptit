<template id="scene_02-template">
  <div id="scene-02" data-composition-id="scene-02" data-width="1080" data-height="1920">
    <style>
      /* --- Fonts --- */
      @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,400&display=swap');

      /* --- Composition Base --- */
      #scene-02 {
        background-color: #060810;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      /* --- Atmosphere & Design Tokens --- */
      .s2-bg-dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.35;
        pointer-events: none;
      }

      .s2-radial-glow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(57, 255, 20, 0.08) 0%, transparent 60%);
        pointer-events: none;
      }

      .s2-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.4) 2px,
          rgba(0, 0, 0, 0.4) 4px
        );
        opacity: 0.2;
        pointer-events: none;
        z-index: 10;
      }

      /* --- Layout Wrapper --- */
      .s2-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 240px;
        box-sizing: border-box;
        z-index: 5;
      }

      /* --- Typography Components --- */
      .s2-counter {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 160px;
        color: #39FF14;
        line-height: 1;
        text-shadow: 0 0 40px rgba(57, 255, 20, 0.5);
        margin-bottom: 24px;
        will-change: transform, opacity, color;
      }

      .s2-label {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 34px;
        color: #FFFFFF;
        letter-spacing: 0.5px;
        margin-bottom: 80px;
        will-change: transform, opacity;
      }

      .s2-reality {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 28px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        max-width: 800px;
        will-change: transform, opacity;
      }

      .s2-question {
        position: absolute;
        right: 220px;
        bottom: 280px;
        font-family: 'Exo 2', sans-serif;
        font-weight: 700;
        font-size: 90px;
        color: #39FF14;
        filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.6));
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Helper */
      .clip { display: block; }
    </style>

    <!-- Visual Background Elements -->
    <div class="s2-bg-dot-grid"></div>
    <div class="s2-radial-glow"></div>
    <div class="s2-scanlines"></div>

    <!-- Scene Content -->
    <div class="s2-content">
      <div id="el-counter" class="clip s2-counter">0</div>
      <div id="el-label" class="clip s2-label">model AI mới/tháng</div>
      <div id="el-reality" class="clip s2-reality">
        Nhưng chẳng cái nào<br>thông minh hơn.
      </div>
    </div>

    <div id="el-question" class="clip s2-question">?</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // --- Rolling Counter Logic ---
      const elCounter = document.getElementById('el-counter');
      let currentValue = 0;
      const targetValue = 5;

      // --- Timeline Construction ---
      const tl = gsap.timeline({ paused: true });

      // 1. ENTRANCE: Counter snaps in
      tl.from("#el-counter", { 
        y: -40, 
        opacity: 0, 
        scale: 0.8, 
        duration: 0.7, 
        ease: "expo.out" 
      }, 0.3);

      // 2. COUNTER ROLLING: 0 → 5 over ~1.2s
      // Runs concurrently with entrance, settles when number hits 5
      tl.to({}, {
        duration: 1.3, // Starts at 0.3, ends at 1.6
        ease: "none",
        onUpdate: function() {
          const v = Math.floor(this.progress() * targetValue);
          if (v !== currentValue) {
            currentValue = v;
            elCounter.textContent = currentValue;
          }
        }
      }, 0.3);

      // 3. ENTRANCE: Label drifts up (after counter established)
      tl.from("#el-label", { 
        y: 60, 
        opacity: 0, 
        duration: 0.8, 
        ease: "power3.out" 
      }, 1.6);

      // 4. ENTRANCE: Reality text reveals (cinematic slow wipe)
      tl.from("#el-reality", { 
        y: 40, 
        opacity: 0, 
        duration: 1.2, 
        ease: "power2.inOut" 
      }, 2.4);

      // 5. PUNCTUATION: SFX Visual Feedback (matches audio cues at 0.8, 1.4, 2.0)
      // Quick scale/color flashes on the counter to simulate clicks
      tl.to("#el-counter", { 
        scale: 1.1, 
        color: "#ffffff", 
        duration: 0.1, 
        yoyo: true, 
        repeat: 1,
        overwrite: "auto"
      }, 0.8);

      tl.to("#el-counter", { 
        scale: 1.1, 
        color: "#ffffff", 
        duration: 0.1, 
        yoyo: true, 
        repeat: 1,
        overwrite: "auto"
      }, 1.4);

      tl.to("#el-counter", { 
        scale: 1.15, 
        color: "#ffffff", 
        duration: 0.12, 
        yoyo: true, 
        repeat: 1,
        overwrite: "auto"
      }, 2.0);

      // Reset color to neon green after flash sequence finishes
      tl.set("#el-counter", { color: "#39FF14", scale: 1 }, 2.2);

      // 6. END SCENE: Question Mark appears
      tl.from("#el-question", { 
        scale: 0, 
        opacity: 0, 
        rotation: -20, 
        duration: 0.6, 
        ease: "back.out(1.7)" 
      }, 4.5);

      // 7. AMBIENT: Question mark floats subtly after appearing
      const floatCycle = 0.8;
      const floatRepeat = Math.ceil((5.71 - 5.1) / floatCycle) - 1;
      if (floatRepeat >= 0) {
        tl.to("#el-question", { 
          y: -15, 
          duration: floatCycle / 2, 
          ease: "sine.inOut", 
          yoyo: true, 
          repeat: floatRepeat 
        }, 5.1);
      }

      // Register timeline with matching ID
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-02"] = tl;
    </script>
  </div>
</template>
