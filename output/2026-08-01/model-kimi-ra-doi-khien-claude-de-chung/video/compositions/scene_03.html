<template id="scene_03-template">
  <div id="scene-03" data-composition-id="scene-03" data-width="1080" data-height="1920" data-duration="5.9">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,400&display=swap');

      #scene-03 {
        background-color: #060810;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      /* --- Atmosphere --- */
      .s3-dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.28;
        pointer-events: none;
        z-index: 1;
      }

      .s3-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(57, 255, 20, 0.06) 0%, transparent 55%);
        pointer-events: none;
        z-index: 1;
      }

      .s3-brackets {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #39FF14 50%, transparent 50%) top left / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) top left / 3px 56px no-repeat,
          linear-gradient(270deg, #39FF14 50%, transparent 50%) top right / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) top right / 3px 56px no-repeat,
          linear-gradient(90deg, #39FF14 50%, transparent 50%) bottom left / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) bottom left / 3px 56px no-repeat,
          linear-gradient(270deg, #39FF14 50%, transparent 50%) bottom right / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) bottom right / 3px 56px no-repeat;
        opacity: 0.5;
        pointer-events: none;
        z-index: 10;
      }

      .s3-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.4) 2px,
          rgba(0, 0, 0, 0.4) 4px
        );
        opacity: 0.2;
        pointer-events: none;
        z-index: 10;
      }

      /* --- Content Wrapper --- */
      .s3-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        padding: 160px 80px;
        box-sizing: border-box;
        z-index: 5;
      }

      /* --- Left Column --- */
      .s3-col-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
        max-width: 420px;
        will-change: transform, opacity;
      }

      .s3-header-them {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 28px;
        color: rgba(255, 255, 255, 0.55);
        margin: 0 0 12px 0;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        will-change: transform, opacity;
      }

      .s3-item {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 26px;
        color: #FFFFFF;
        margin: 0;
        position: relative;
        display: inline-block;
        white-space: nowrap;
        will-change: transform, opacity;
      }

      .s3-strike {
        position: absolute;
        top: 50%;
        left: -8px;
        right: -8px;
        height: 2px;
        background-color: #39FF14;
        transform: scaleX(0) translateY(-50%);
        transform-origin: left center;
        will-change: transform;
        pointer-events: none;
      }

      /* --- Center Divider --- */
      .s3-divider {
        position: absolute;
        left: 50%;
        top: 200px;
        bottom: 200px;
        width: 2px;
        background-color: #39FF14;
        transform: translateX(-50%) scaleY(0);
        transform-origin: center top;
        box-shadow: 0 0 12px #39FF14, 0 0 30px rgba(57, 255, 20, 0.4);
        pointer-events: none;
        z-index: 4;
      }

      /* --- Right Column --- */
      .s3-col-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 24px;
        max-width: 420px;
        will-change: transform, opacity;
      }

      .s3-header-kimi {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 36px;
        color: #39FF14;
        margin: 0 0 12px 0;
        text-align: right;
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.7), 0 0 40px rgba(57, 255, 20, 0.3);
        will-change: transform, opacity;
      }

      .s3-badge {
        font-family: 'Exo 2', sans-serif;
        font-weight: 700;
        font-size: 28px;
        color: #FFFFFF;
        margin: 0;
        will-change: transform, opacity;
      }

      .s3-arrow {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 72px;
        color: #39FF14;
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.7), 0 0 40px rgba(57, 255, 20, 0.3);
        line-height: 1;
        will-change: transform, opacity;
      }

      /* Helper */
      .clip { display: block; }
    </style>

    <!-- Atmosphere -->
    <div class="s3-dots"></div>
    <div class="s3-glow"></div>
    <div class="s3-brackets"></div>
    <div class="s3-scanlines"></div>

    <!-- Scene Content -->
    <div class="s3-content">
      <!-- Left Column -->
      <div class="s3-col-left">
        <p class="s3-header-them clip" id="el-header_them">CHÚNG</p>
        <p class="s3-item clip" id="el-them_1">nói nhiều hơn<span class="s3-strike" id="el-strike_1"></span></p>
        <p class="s3-item clip" id="el-them_2">chậm hơn<span class="s3-strike" id="el-strike_2"></span></p>
        <p class="s3-item clip" id="el-them_3">tốn tiền hơn<span class="s3-strike" id="el-strike_3"></span></p>
      </div>

      <!-- Center Divider -->
      <div class="s3-divider clip" id="el-divider_v"></div>

      <!-- Right Column -->
      <div class="s3-col-right">
        <p class="s3-header-kimi clip" id="el-header_kimi">KIMI</p>
        <p class="s3-badge clip" id="el-kimi_badge">khác biệt</p>
        <p class="s3-arrow clip" id="el-arrow_right">→</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const compId = "scene-03";

      // === LEFT COLUMN ENTRIES ===

      // "CHÚNG" snaps in — slight y-down from above
      tl.from("#el-header_them", {
        y: -30,
        opacity: 0,
        duration: 0.5,
        ease: "back.out(2)"
      }, 0.2);

      // them_1 — "nói nhiều hơn" snaps in
      tl.from("#el-them_1", {
        x: -30,
        opacity: 0,
        duration: 0.4,
        ease: "back.out(2)"
      }, 0.4);
      // Strike-through draw on for them_1
      tl.fromTo("#el-strike_1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "expo.out" },
        0.52
      );
      // Click SFX visual nudge
      tl.to("#el-them_1", {
        x: "+=4",
        duration: 0.06,
        ease: "power4.out",
        yoyo: true,
        repeat: 1,
        overwrite: "auto"
      }, 0.4);

      // them_2 — "chậm hơn"
      tl.from("#el-them_2", {
        x: -30,
        opacity: 0,
        duration: 0.4,
        ease: "back.out(2)"
      }, 1.0);
      tl.fromTo("#el-strike_2",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "expo.out" },
        1.12
      );
      tl.to("#el-them_2", {
        x: "+=4",
        duration: 0.06,
        ease: "power4.out",
        yoyo: true,
        repeat: 1,
        overwrite: "auto"
      }, 1.0);

      // them_3 — "tốn tiền hơn"
      tl.from("#el-them_3", {
        x: -30,
        opacity: 0,
        duration: 0.4,
        ease: "back.out(2)"
      }, 1.6);
      tl.fromTo("#el-strike_3",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: "expo.out" },
        1.72
      );
      tl.to("#el-them_3", {
        x: "+=4",
        duration: 0.06,
        ease: "power4.out",
        yoyo: true,
        repeat: 1,
        overwrite: "auto"
      }, 1.6);

      // === PIVOT: Whoosh moment (~3.8s) ===
      // Divider sweeps down center
      tl.fromTo("#el-divider_v",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.5, ease: "expo.out" },
        3.8
      );

      // Glow pulse on divider as it appears
      tl.to("#el-divider_v", {
        boxShadow: "0 0 20px #39FF14, 0 0 50px rgba(57, 255, 20, 0.6)",
        duration: 0.15,
        ease: "power2.out",
        yoyo: true,
        repeat: 1
      }, 3.95);

      // KIMI blooms in from right — scale pop + glow burst
      tl.from("#el-header_kimi", {
        x: 40,
        opacity: 0,
        scale: 0.7,
        duration: 0.5,
        ease: "elastic.out(1, 0.4)"
      }, 3.9);

      // KIMI glow intensify
      tl.to("#el-header_kimi", {
        textShadow: "0 0 40px #39FF14, 0 0 80px rgba(57, 255, 20, 0.5)",
        duration: 0.3,
        ease: "power2.out",
        yoyo: true,
        repeat: 1
      }, 4.1);

      // "khác biệt" badge snaps in after KIMI
      tl.from("#el-kimi_badge", {
        x: 30,
        opacity: 0,
        duration: 0.35,
        ease: "back.out(2)"
      }, 4.15);

      // Arrow → slides in from right
      tl.from("#el-arrow_right", {
        x: 60,
        opacity: 0,
        rotation: -15,
        duration: 0.4,
        ease: "back.out(2)"
      }, 4.3);

      // === AMBIENT: Subtle neon pulse on KIMI header (starts after intensity pulse finishes at 4.7s) ===
      const ambientRepeat = Math.ceil((5.9 - 4.7) / 1.5) - 1;
      if (ambientRepeat >= 0) {
        tl.to("#el-header_kimi", {
          textShadow: "0 0 12px #39FF14, 0 0 24px rgba(57, 255, 20, 0.4)",
          duration: 0.75,
          ease: "sine.inOut",
          yoyo: true,
          repeat: ambientRepeat
        }, 4.7);
      }

      // Register timeline
      window.__timelines[compId] = tl;
    </script>
  </div>
</template>
