<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scene 03 — Comparison</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  #scene-03 {
    --bg: #060810;
    --accent: #39FF14;
    --white: #FFFFFF;
    --muted: rgba(255,255,255,0.55);
    --surface: rgba(57,255,20,0.12);
    --strike-red: rgba(255,80,80,0.5);

    width: 1080px;
    height: 1920px;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ── Dot grid ── */
  #scene-03 .s3-dot-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.28) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Radial glow ── */
  #scene-03 .s3-radial-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 600px 600px at 540px 680px, rgba(57,255,20,0.08), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Scanlines ── */
  #scene-03 .s3-scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* ── Corner brackets ── */
  #scene-03 .s3-bracket {
    position: absolute;
    width: 56px;
    height: 56px;
    border-color: rgba(255,255,255,0.5);
    border-style: solid;
    border-width: 0;
    z-index: 2;
    pointer-events: none;
  }
  #scene-03 .s3-br--tl { top: 48px; left: 48px; border-top-width: 3px; border-left-width: 3px; }
  #scene-03 .s3-br--tr { top: 48px; right: 48px; border-top-width: 3px; border-right-width: 3px; }
  #scene-03 .s3-br--bl { bottom: 48px; left: 48px; border-bottom-width: 3px; border-left-width: 3px; }
  #scene-03 .s3-br--br { bottom: 48px; right: 48px; border-bottom-width: 3px; border-right-width: 3px; }

  /* ── Layout containers ── */
  #scene-03 .s3-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0 140px;
    gap: 0;
    box-sizing: border-box;
  }

  #scene-03 .s3-columns {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0;
    padding-top: 40px;
  }

  /* ── Column styles ── */
  #scene-03 .s3-col {
    display: flex;
    flex-direction: column;
    gap: 40px;
    flex: 1;
  }

  #scene-03 .s3-col-left  { align-items: flex-start; padding-left: 0; }
  #scene-03 .s3-col-right { align-items: flex-start; padding-right: 0; }

  /* ── Headers ── */
  #scene-03 .s3-header {
    font-family: 'Exo 2', sans-serif;
    font-weight: 900;
    letter-spacing: 0.06em;
    line-height: 1.2;
    text-transform: uppercase;
  }

  #scene-03 .s3-header-left {
    font-size: 28px;
    color: var(--muted);
  }

  #scene-03 .s3-header-right {
    font-size: 36px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(57,255,20,0.6), 0 0 40px rgba(57,255,20,0.3);
  }

  /* ── Text items ── */
  #scene-03 .s3-item {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.4;
    position: relative;
    display: inline-block;
    padding-bottom: 4px;
  }

  /* ── Strike-through (draw-on via pseudo-element) ── */
  #scene-03 .s3-strike-line {
    position: absolute;
    left: -8px;
    top: 55%;
    transform: translateY(-50%);
    height: 3px;
    width: 0;
    background: var(--strike-red);
    border-radius: 2px;
    pointer-events: none;
  }

  /* ── Badge ── */
  #scene-03 .s3-badge {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: var(--white);
    background: var(--surface);
    border: 1px solid rgba(57,255,20,0.3);
    border-radius: 16px;
    padding: 16px 40px;
    display: inline-block;
    letter-spacing: 0.04em;
  }

  /* ── Arrow ── */
  #scene-03 .s3-arrow {
    font-family: 'Inter', sans-serif;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 0 12px rgba(57,255,20,0.5));
    margin-top: 16px;
  }

  /* ── Divider ── */
  #scene-03 .s3-divider {
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    height: 0;
    background: linear-gradient(
      180deg,
      transparent 0%,
      var(--accent) 15%,
      var(--accent) 85%,
      transparent 100%
    );
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: 0 0 16px rgba(57,255,20,0.5);
    pointer-events: none;
  }

  /* ── Glow pulse on KIMI header ── */
  #scene-03 .s3-header-right {
    transition: none;
  }

  /* ── Subtitle ── */
  #scene-03 .s3-subtitle-track {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 0 160px;
  }

  #scene-03 .s3-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--white);
    background: rgba(6,8,16,0.7);
    backdrop-filter: blur(6px);
    padding: 14px 36px;
    border-radius: 12px;
    border: 1px solid rgba(57,255,20,0.15);
    text-align: center;
    line-height: 1.5;
    max-width: 900px;
    opacity: 0;
  }
</style>
</head>
<body>

<!-- ── Template Wrapper ── -->
<template id="scene-03-template">
<div id="scene-03" data-composition-id="scene-03" data-width="1080" data-height="1920">

  <!-- Ambient layers -->
  <div class="s3-dot-grid"></div>
  <div class="s3-radial-glow"></div>
  <div class="s3-scanlines"></div>
  <div class="s3-bracket s3-br--tl"></div>
  <div class="s3-bracket s3-br--tr"></div>
  <div class="s3-bracket s3-br--bl"></div>
  <div class="s3-bracket s3-br--br"></div>

  <!-- Main content -->
  <div class="s3-content">
    <div class="s3-columns">

      <!-- LEFT COLUMN — "CHÚNG" -->
      <div class="s3-col s3-col-left">
        <div class="s3-header s3-header-left clip" id="s3-chung">CHÚNG</div>
        <div class="clip" id="s3-them-1">
          <span class="s3-item">nói nhiều hơn</span>
          <span class="s3-strike-line"></span>
        </div>
        <div class="clip" id="s3-them-2">
          <span class="s3-item">chậm hơn</span>
          <span class="s3-strike-line"></span>
        </div>
        <div class="clip" id="s3-them-3">
          <span class="s3-item">tốn tiền hơn</span>
          <span class="s3-strike-line"></span>
        </div>
      </div>

      <!-- VERTICAL DIVIDER -->
      <div class="s3-divider clip" id="s3-divider"></div>

      <!-- RIGHT COLUMN — "KIMI" -->
      <div class="s3-col s3-col-right">
        <div class="s3-header s3-header-right clip" id="s3-kimi">KIMI</div>
        <div class="clip" id="s3-badge-wrap">
          <span class="s3-badge" id="s3-badge">khác biệt</span>
        </div>
        <div class="clip" id="s3-arrow-wrap">
          <span class="s3-arrow" id="s3-arrow">→</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Subtitle -->
  <div class="s3-subtitle-track">
    <div class="s3-subtitle clip" id="s3-subtitle">
      những model khác thì tệ hết — KIMI khác biệt
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  /* ═══════════════════════════════════
     ENTRANCES
     ═══════════════════════════════════ */

  // ── t=0.2s : "CHÚNG" snaps in ────────────────────────────────
  tl.from('#s3-chung', {
    x: -40,
    opacity: 0,
    duration: 0.35,
    ease: 'back.out(2)',
  }, 0.2);

  // ── t=0.4s : "nói nhiều hơn" snaps in ────────────────────────
  tl.from('#s3-them-1 > .s3-item', {
    x: -30,
    opacity: 0,
    duration: 0.3,
    ease: 'back.out(2)',
  }, 0.4);

  // ── t=1.0s : "chậm hơn" snaps in ─────────────────────────────
  tl.from('#s3-them-2 > .s3-item', {
    x: -30,
    opacity: 0,
    duration: 0.3,
    ease: 'back.out(2)',
  }, 1.0);

  // ── t=1.6s : "tốn tiền hơn" snaps in ─────────────────────────
  tl.from('#s3-them-3 > .s3-item', {
    x: -30,
    opacity: 0,
    duration: 0.3,
    ease: 'back.out(2)',
  }, 1.6);

  // ── Draw-on strike-throughs after each item appears ─────────
  tl.to('#s3-them-1 .s3-strike-line', {
    width: 'calc(100% + 16px)',
    duration: 0.25,
    ease: 'power2.inOut',
  }, 0.65);

  tl.to('#s3-them-2 .s3-strike-line', {
    width: 'calc(100% + 16px)',
    duration: 0.25,
    ease: 'power2.inOut',
  }, 1.25);

  tl.to('#s3-them-3 .s3-strike-line', {
    width: 'calc(100% + 16px)',
    duration: 0.25,
    ease: 'power2.inOut',
  }, 1.85);

  // ── Pause / Hold ────────────────────────────────────────────
  // (default until next cue)

  // ── t=3.8s : divider sweeps down ────────────────────────────
  tl.fromTo('#s3-divider', {
    scaleY: 0,
  }, {
    scaleY: 1,
    duration: 0.4,
    ease: 'expo.out',
    transformOrigin: 'top center',
  }, 3.8);

  // ── t=3.9s : KIMI blooms in ─────────────────────────────────
  tl.from('#s3-kimi', {
    scale: 0.6,
    opacity: 0,
    duration: 0.45,
    ease: 'back.out(2)',
  }, 3.9);

  // ── t=4.0s : "khác biệt" badge snaps in ─────────────────────
  tl.from('#s3-badge', {
    y: 30,
    opacity: 0,
    duration: 0.35,
    ease: 'back.out(2)',
  }, 4.0);

  // ── t=4.1s : arrow enters ───────────────────────────────────
  tl.from('#s3-arrow', {
    x: 30,
    opacity: 0,
    duration: 0.3,
    ease: 'back.out(2)',
  }, 4.1);

  // ── t=4.2s : subtitle fades in ──────────────────────────────
  tl.from('#s3-subtitle', {
    y: 20,
    opacity: 0,
    duration: 0.4,
    ease: 'power2.out',
  }, 4.2);

  /* ═══════════════════════════════════
     AMBIENT / CONTINUOUS ANIMATIONS
     ═══════════════════════════════════ */

  // ── KIMI header glow pulse (slow sine) ──────────────────────
  tl.to('#s3-kimi', {
    textShadow: '0 0 30px rgba(57,255,20,0.9), 0 0 60px rgba(57,255,20,0.5)',
    duration: 1.2,
    ease: 'sine.inOut',
    repeat: Math.floor(5.9 / 1.2) - 1,
    yoyo: true,
  }, 3.9);

  // ── Radial glow subtle breathe ──────────────────────────────
  tl.to('.s3-radial-glow', {
    opacity: 0.6,
    duration: 2.0,
    ease: 'sine.inOut',
    repeat: Math.floor(5.9 / 2.0) - 1,
    yoyo: true,
  }, 0);

  // Register timeline
  window.__timelines['scene-03'] = tl;
})();
</script>
</body>
</template>
</html>
