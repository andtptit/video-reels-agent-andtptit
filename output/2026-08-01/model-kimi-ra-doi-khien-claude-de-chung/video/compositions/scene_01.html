<template id="scene-01-template">
  <div id="scene-01" data-composition-id="scene-01" data-width="1080" data-height="1920" data-duration="4.85">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Inter:wght@400;600&display=swap');
      
      #scene-01 {
        background-color: #060810;
        position: relative;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }

      /* Atmosphere Layers */
      .s1-atmo { position: absolute; inset: 0; pointer-events: none; }
      
      .s1-dots {
        background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: 0.28;
      }
      
      .s1-glow {
        background: radial-gradient(circle at 50% 45%, rgba(57, 255, 20, 0.15) 0%, transparent 60%);
      }
      
      .s1-brackets {
        background: 
          linear-gradient(90deg, #39FF14 50%, transparent 50%) top left / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) top left / 3px 56px no-repeat,
          linear-gradient(270deg, #39FF14 50%, transparent 50%) top right / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) top right / 3px 56px no-repeat,
          linear-gradient(90deg, #39FF14 50%, transparent 50%) bottom left / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) bottom left / 3px 56px no-repeat,
          linear-gradient(270deg, #39FF14 50%, transparent 50%) bottom right / 56px 3px no-repeat,
          linear-gradient(180deg, #39FF14 50%, transparent 50%) bottom right / 3px 56px no-repeat;
        background-size: 100% 100%;
        opacity: 0.5;
      }
      
      .s1-scanlines {
        background: linear-gradient(to bottom, rgba(255,255,255,0.04) 50%, transparent 50%);
        background-size: 100% 4px;
      }

      /* Content Container */
      .s1-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 120px 100px;
        box-sizing: border-box;
        gap: 32px;
      }

      /* Typography */
      .s1-title {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 140px;
        color: #39FF14;
        letter-spacing: -4px;
        text-transform: uppercase;
        text-align: center;
        line-height: 1;
        margin: 0;
        will-change: transform, opacity;
        text-shadow: 0 0 20px #39FF14; /* Base glow */
      }

      .s1-hook {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 36px;
        color: #FFFFFF;
        text-align: center;
        margin: 0;
        will-change: transform, opacity;
      }

      .s1-divider {
        width: 400px;
        height: 2px;
        background-color: #39FF14;
        transform-origin: center;
        will-change: transform, opacity;
      }

      .s1-claude {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 28px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        margin: 0;
        will-change: transform, opacity;
      }

      .s1-reason {
        font-family: 'Exo 2', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #FFFFFF;
        text-align: center;
        letter-spacing: 1px;
        margin: 0;
        will-change: transform, opacity;
      }
    </style>

    <!-- Atmosphere -->
    <div class="s1-atmo s1-dots"></div>
    <div class="s1-atmo s1-glow"></div>
    <div class="s1-atmo s1-brackets"></div>
    <div class="s1-atmo s1-scanlines"></div>

    <!-- Content -->
    <div class="s1-content">
      <h1 class="s1-title clip" id="el-title_kimi">KIMI</h1>
      <p class="s1-hook clip" id="el-subtitle_hook">vừa ra mắt.</p>
      <div class="s1-divider clip" id="el-divider"></div>
      <p class="s1-claude clip" id="el-claude_alert">Claude đang lo.</p>
      <p class="s1-reason clip" id="el-reason">Và có lý do.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Neon Pulse on Title (Fixed selector and Math.floor repeat logic)
      tl.to("#el-title_kimi", {
        textShadow: "0 0 60px #39FF14, 0 0 120px #39FF14",
        repeat: Math.floor(4.85 / 2) - 1, 
        yoyo: true, 
        duration: 2,
        ease: "sine.inOut"
      }, 0);

      // Scene Entrance Choreography
      tl.from("#el-title_kimi", {
        scale: 0,
        opacity: 0,
        duration: 0.7,
        ease: "elastic.out(1, 0.3)"
      }, 0);

      tl.from("#el-subtitle_hook", {
        y: 30,
        opacity: 0,
        duration: 0.6,
        ease: "power3.out"
      }, 0.15);

      tl.from("#el-divider", {
        scaleX: 0,
        opacity: 0,
        duration: 0.5,
        ease: "expo.out"
      }, 0.5);

      tl.from("#el-claude_alert", {
        y: 40,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out"
      }, 1.0);

      tl.from("#el-reason", {
        y: 20,
        opacity: 0,
        duration: 0.4,
        ease: "back.out(1.7)"
      }, 2.0);

      window.__timelines["scene-01"] = tl;
    </script>
  </div>
</template>
