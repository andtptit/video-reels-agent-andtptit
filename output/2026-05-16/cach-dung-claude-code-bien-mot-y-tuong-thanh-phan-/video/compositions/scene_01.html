<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1080" data-height="1920">

    <!-- Background layers -->
    <div class="s1-bg" data-layout-ignore>
      <div class="s1-dot-grid"></div>
      <div class="s1-radial-glow"></div>
      <div class="s1-scanlines"></div>
    </div>

    <!-- Corner brackets -->
    <div class="s1-corner s1-corner-tl" data-layout-ignore></div>
    <div class="s1-corner s1-corner-tr" data-layout-ignore></div>
    <div class="s1-corner s1-corner-bl" data-layout-ignore></div>
    <div class="s1-corner s1-corner-br" data-layout-ignore></div>

    <!-- Main content -->
    <div class="s1-content">
      <h1 class="s1-headline">Bạn có một ý tưởng.</h1>

      <div class="s1-tags">
        <span class="s1-tag">ứng dụng</span>
        <span class="s1-tag">công cụ</span>
        <span class="s1-tag">dịch vụ số</span>
      </div>

      <h2 class="s1-contrast">Nhưng bạn không biết code.</h2>

      <div class="s1-strike-wrap">
        <p class="s1-strike-text">Thuê dev = mấy chục triệu.</p>
        <div class="s1-strike-line"></div>
      </div>
    </div>

    <style>
      #scene-01 {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #060810;
        overflow: hidden;
      }

      /* ── Background ── */
      .s1-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .s1-dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(57,255,20,0.28) 1.5px, transparent 1.5px);
        background-size: 48px 48px;
      }

      .s1-radial-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 700px 700px at 50% 50%, rgba(57,255,20,0.18) 0%, transparent 70%);
        opacity: 0;
      }

      .s1-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0,0,0,0.04) 3px,
          rgba(0,0,0,0.04) 4px
        );
      }

      /* ── Corner brackets ── */
      .s1-corner {
        position: absolute;
        width: 56px;
        height: 56px;
        border-color: #39FF14;
        border-style: solid;
        opacity: 0.5;
        z-index: 3;
      }

      .s1-corner-tl { top: 60px; left: 60px; border-width: 3px 0 0 3px; }
      .s1-corner-tr { top: 60px; right: 60px; border-width: 3px 3px 0 0; }
      .s1-corner-bl { bottom: 60px; left: 60px; border-width: 0 0 3px 3px; }
      .s1-corner-br { bottom: 60px; right: 60px; border-width: 0 3px 3px 0; }

      /* ── Content ── */
      .s1-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 140px 88px;
        gap: 48px;
        box-sizing: border-box;
        z-index: 2;
      }

      .s1-headline {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 88px;
        color: #FFFFFF;
        text-shadow: 0 0 40px rgba(57,255,20,0.25), 0 0 80px rgba(57,255,20,0.1);
        line-height: 1.1;
        margin: 0;
      }

      .s1-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }

      .s1-tag {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 34px;
        color: #39FF14;
        background: rgba(57,255,20,0.12);
        border: 1.5px solid rgba(57,255,20,0.4);
        padding: 12px 28px;
        border-radius: 10px;
        letter-spacing: 0.02em;
      }

      .s1-contrast {
        font-family: 'Exo 2', sans-serif;
        font-weight: 900;
        font-size: 74px;
        color: #FFFFFF;
        line-height: 1.1;
        margin: 0;
      }

      .s1-strike-wrap {
        position: relative;
        display: block;
        width: 100%;
      }

      .s1-strike-text {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 50px;
        color: rgba(255,255,255,0.55);
        margin: 0;
        line-height: 1.3;
      }

      .s1-strike-line {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,0.65);
        transform-origin: left center;
        transform: scaleX(0);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Radial glow fades in slowly — cinematic mood
      tl.to(".s1-radial-glow", { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.3);

      // Headline slides up and fades in — slow, cinematic
      tl.from(".s1-headline", { y: 60, opacity: 0, duration: 1.2, ease: "power2.out" }, 0.8);

      // 3 tags stagger in from below
      tl.from(".s1-tag", { y: 35, opacity: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.25 }, 2.5);

      // Contrast line pushes in with weight — scale + fade
      tl.from(".s1-contrast", { scale: 0.88, opacity: 0, duration: 0.65, ease: "expo.out" }, 5.2);

      // Strike text fades in
      tl.from(".s1-strike-text", { opacity: 0, duration: 0.5, ease: "power2.out" }, 7.2);

      // Strikethrough line sweeps left → right
      tl.to(".s1-strike-line", { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 7.75);

      window.__timelines["scene-01"] = tl;
    </script>
  </div>
</template>
