      .s2-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .s2-dot-grid {
        position: absolute;

      }

      .s2-radial-glow {

      .s2-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(

          transparent,

          rgba(0,0,0,0.04) 3px,
          rgba(0,0,0,0.04) 4px
        );
      }

      /* ── Corner brackets ── */
      .s2-corner {
        position: absolute;

        z-index: 3;

      .s2-corner-tl { top: 60px; left: 60px; border-width: 3px 0 0 3px; }
      .s2-corner-tr { top: 60px; right: 60px; border-width: 3px 3px 0 0; }
      .s2-corner-bl { bottom: 60px; left: 60px; border-width: 0 0 3px 3px; }

      .s2-p2 { left: 32%; bottom: 28%; }
      .s2-p3 { left: 55%; bottom: 32%; }

      .s2-p5 { left: 82%; bottom: 40%; }

      /* ── Content ── */
      .s2-content {
        position: relative;

        display: flex;

      .s2-benefit-2 {
        font-family: 'Inter', sans-serif;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Old-world badge fades out quickly
      tl.from(".s2-old-badge", { opacity: 0, y: -20, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.to(".s2-old-badge", { opacity: 0, duration: 0.5, ease: "power2.in" }, 1.2);

      // Brand name sweeps in from left — snappy back.out
      tl.from(".s2-brand", { x: -80, opacity: 0, duration: 0.7, ease: "back.out(1.5)" }, 1.5);

      // Benefits stagger in
      tl.from(".s2-benefit-1", { y: 40, opacity: 0, duration: 0.55, ease: "expo.out" }, 2.6);
      tl.from(".s2-benefit-2", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 3.2);

      // Particles float up
      const particles = [".s2-p1", ".s2-p2", ".s2-p3", ".s2-p4", ".s2-p5"];
      const startTimes = [3.5, 3.8, 4.1, 4.4, 4.7];
      particles.forEach((sel, i) => {
        const cycleDuration = 3.2;
        const sceneEnd = 9.61;
        const repeatCount = Math.ceil((sceneEnd - startTimes[i]) / cycleDuration);
        tl.fromTo(sel,
          { y: 0, opacity: 0 },
          { y: -280, opacity: 0.6, duration: cycleDuration, ease: "power1.out", repeat: repeatCount },
          startTimes[i]
        );
      });

      window.__timelines["scene-02"] = tl;
    </script>
