      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Step badge

      // Title snaps in

      // Rocket row floats up

      // Rocket float animation
      const rocketDuration = 14.58;
      const floatCycle = 2.0;
      const floatRepeat = Math.ceil(rocketDuration / floatCycle);
      tl.to(".s7-rocket", {
        y: -16,
        duration: floatCycle / 2,
        ease: "sine.inOut",
        repeat: floatRepeat,
        yoyo: true
      }, 1.0);

      // Tagline pulses in
      tl.from(".s7-tagline", { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" }, 8.5);

      // Tagline subtle pulse glow
      const pulseCycle = 1.5;
      const pulseRepeat = Math.ceil(rocketDuration / pulseCycle);
      tl.to(".s7-tagline", {
        textShadow: "0 0 30px rgba(57,255,20,0.9), 0 0 60px rgba(57,255,20,0.4)",
        duration: pulseCycle / 2,
        ease: "sine.inOut",
        repeat: pulseRepeat,
        yoyo: true
