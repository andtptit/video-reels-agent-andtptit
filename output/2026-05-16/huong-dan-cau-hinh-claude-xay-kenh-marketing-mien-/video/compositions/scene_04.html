    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 9.4;
      const tl = gsap.timeline({ paused: true });

      // snappy — back.out, cascade theo click
      tl.from('#s4-title',   { opacity: 0, y: -20, duration: 0.4,  ease: 'expo.out'    }, 0.2);
      tl.from('#s4-step-1',  { opacity: 0, y: 40, scale: 0.92, transformOrigin: 'center bottom', duration: 0.45, ease: 'back.out(2)' }, 1.0);

      tl.to('#s4-step-2', { boxShadow: '0 0 36px rgba(57,255,20,0.35)', duration: 0.8, ease: 'sine.inOut', repeat: shimReps, yoyo: true }, 3.5);
