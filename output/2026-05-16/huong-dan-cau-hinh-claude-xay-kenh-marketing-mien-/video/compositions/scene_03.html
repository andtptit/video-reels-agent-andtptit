<template id="scene-03-template">
  <div id="scene-03" data-composition-id="scene-03" data-width="1080" data-height="1920">
    <style>
      #scene-03 { position: absolute; inset: 0; overflow: hidden; font-family: 'Exo 2', 'Inter', sans-serif; }
      .s3-node  { position: absolute; left: 440px; top: 340px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, rgba(57,255,20,0.22), rgba(57,255,20,0.04) 70%); border: 2.5px solid #39FF14; box-shadow: 0 0 28px #39FF14, 0 0 56px rgba(57,255,20,0.45), 0 0 90px rgba(57,255,20,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; z-index: 20; }
      .s3-node-main { font-size: 28px; font-weight: 900; color: #39FF14; line-height: 1; text-shadow: 0 0 14px #39FF14; }
      .s3-node-sub  { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); letter-spacing: 3px; text-transform: uppercase; }
      .s3-ring-1 { position: absolute; left: 415px; top: 315px; width: 250px; height: 250px; border-radius: 50%; border: 1.5px solid rgba(57,255,20,0.4); }
      .s3-svg    { position: absolute; inset: 0; z-index: 16; pointer-events: none; overflow: visible; }
      .s3-card   { position: absolute; left: 100px; width: 880px; height: 130px; border-radius: 16px; background: rgba(8,12,24,0.92); border: 2px solid rgba(57,255,20,0.55); box-shadow: 0 0 24px rgba(57,255,20,0.15); display: flex; align-items: center; padding: 0 28px; gap: 18px; z-index: 20; }
      .s3-card-fb    { top: 720px; }
      .s3-card-ig    { top: 900px; }
      .s3-card-video { top: 1080px; }
      .s3-card-icon  { flex-shrink: 0; width: 56px; height: 56px; border-radius: 10px; border: 1.5px solid rgba(57,255,20,0.42); background: rgba(57,255,20,0.11); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #39FF14; }
      .s3-card-title { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; }
      .s3-card-tag   { font-size: 13px; font-weight: 600; color: rgba(57,255,20,0.7); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <audio id="s3-sfx-ding1" class="clip" data-start="2.5" data-duration="1" data-track-index="34" data-volume="0.45" src="../assets/sfx/ding.mp3"></audio>
    <audio id="s3-sfx-ding2" class="clip" data-start="4.5" data-duration="1" data-track-index="35" data-volume="0.4"  src="../assets/sfx/ding.mp3"></audio>
    <audio id="s3-sfx-ding3" class="clip" data-start="6.5" data-duration="1" data-track-index="36" data-volume="0.4" src="../assets/sfx/ding.mp3"></audio>

    <!-- SVG: node bottom (540,540) → cards top-center (540,720), (540,900), (540,1080) -->
    <svg id="s3-svg" class="clip s3-svg" data-start="1.2" data-duration="9.2" data-track-index="5" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <line id="s3-line-1" x1="540" y1="542" x2="540" y2="720"  stroke="#39FF14" stroke-width="2.5" stroke-dasharray="180" stroke-dashoffset="180" opacity="0.85"/>
      <line id="s3-line-2" x1="540" y1="852" x2="540" y2="900"  stroke="#39FF14" stroke-width="2.5" stroke-dasharray="50"  stroke-dashoffset="50"  opacity="0.85"/>
      <line id="s3-line-3" x1="540" y1="1032" x2="540" y2="1080" stroke="#39FF14" stroke-width="2.5" stroke-dasharray="50"  stroke-dashoffset="50"  opacity="0.85"/>
    </svg>

    <div id="s3-ring-1" class="clip s3-ring-1" data-start="0.3" data-duration="10.1" data-track-index="2"></div>
    <div id="s3-node"   class="clip s3-node"   data-start="0.3" data-duration="10.1" data-track-index="3">
      <span class="s3-node-main">Claude</span><span class="s3-node-sub">AI</span>
    </div>

    <!-- card-fb xuất hiện khi "Facebook" được nói (anchor: 1.753s) -->
    <div id="s3-card-fb"    class="clip s3-card s3-card-fb"    data-start="1.8"  data-duration="8.6" data-track-index="6">
      <div class="s3-card-icon">f</div>
      <div><div class="s3-card-title">BÀI ĐĂNG FACEBOOK</div><div class="s3-card-tag">Tự động tạo</div></div>
    </div>
    <div id="s3-card-ig"    class="clip s3-card s3-card-ig"    data-start="4.5"  data-duration="5.9" data-track-index="7">
      <div class="s3-card-icon">📷</div>
      <div><div class="s3-card-title">CAPTION INSTAGRAM</div><div class="s3-card-tag">Tự động tạo</div></div>
    </div>
    <div id="s3-card-video" class="clip s3-card s3-card-video" data-start="6.5"  data-duration="3.9" data-track-index="8">
      <div class="s3-card-icon">▶</div>
      <div><div class="s3-card-title">SCRIPT VIDEO</div><div class="s3-card-tag">Tự động tạo</div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 10.4;
      const tl = gsap.timeline({ paused: true });

      tl.from('#s3-ring-1', { opacity: 0, scale: 0.4, transformOrigin: 'center', duration: 0.8, ease: 'expo.out' }, 0.30);
      tl.from('#s3-node',   { opacity: 0, scale: 0,   transformOrigin: 'center', duration: 0.6, ease: 'back.out(2.2)' }, 0.35);

      const ringPulse = Math.ceil(DURATION / 2.4);
      tl.to('#s3-ring-1', { scale: 1.07, opacity: 0.55, transformOrigin: 'center', duration: 1.2, ease: 'sine.inOut', repeat: ringPulse, yoyo: true, overwrite: 'auto' }, 1.3);

      // SVG lines draw-on → cards
      tl.to('#s3-line-1', { strokeDashoffset: 0, duration: 0.5, ease: 'power2.inOut' }, 1.3);
      tl.from('#s3-card-fb',    { opacity: 0, y: 30, duration: 0.5, ease: 'expo.out' }, 1.8);

      tl.to('#s3-line-2', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.inOut' }, 4.2);
      tl.from('#s3-card-ig',    { opacity: 0, y: 30, duration: 0.5, ease: 'expo.out' }, 4.5);

      tl.to('#s3-line-3', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.inOut' }, 6.2);
      tl.from('#s3-card-video', { opacity: 0, y: 30, duration: 0.5, ease: 'expo.out' }, 6.5);

      // focal: ding → node pulse
      tl.to('#s3-node', { scale: 1.08, transformOrigin: 'center', duration: 0.14, ease: 'power2.out'         }, 2.5);
      tl.to('#s3-node', { scale: 1.00, transformOrigin: 'center', duration: 0.32, ease: 'elastic.out(1,0.5)', overwrite: 'auto' }, 2.64);

      window.__timelines['scene-03'] = tl;
    </script>
  </div>
</template>
