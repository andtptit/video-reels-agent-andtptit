<template id="scene-03-template">
  <div id="scene-03" data-composition-id="scene-03" data-width="1920" data-height="1080">
    <style>
      #scene-03   { position: absolute; inset: 0; overflow: hidden; font-family: 'Exo 2', 'Inter', sans-serif; }
      .s3-halo    { position: absolute; left: 660px; top: 190px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(57,255,20,0.14) 0%, rgba(57,255,20,0.04) 50%, transparent 70%); filter: blur(2px); }
      .s3-tagline { position: absolute; top: 372px; left: 0; width: 1920px; text-align: center; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; color: rgba(57,255,20,0.6); letter-spacing: 7px; text-transform: uppercase; }
      .s3-cta     { position: absolute; top: 416px; left: 0; width: 1920px; text-align: center; font-size: 96px; font-weight: 900; color: #fff; line-height: 1.05; text-shadow: 0 0 40px rgba(255,255,255,0.12); }
      .s3-badge   { position: absolute; top: 680px; left: 0; width: 1920px; display: flex; justify-content: center; }
      .s3-badge-inner { display: inline-flex; align-items: center; gap: 16px; padding: 18px 40px; border-radius: 50px; background: rgba(8,12,24,0.92); border: 2px solid rgba(57,255,20,0.6); box-shadow: 0 0 28px rgba(57,255,20,0.2); font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 1.5px; }
      .s3-icon    { color: #39FF14; text-shadow: 0 0 10px rgba(57,255,20,0.8); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <!-- SFX chime at 0.4 -->
    <audio id="s3-sfx-chime" class="clip" data-start="0.4" data-duration="1.5" data-track-index="9" data-volume="0.5" src="../assets/sfx/chime.mp3"></audio>

    <div  id="s3-halo"    class="clip s3-halo"    data-start="0.1" data-duration="5.4" data-track-index="1"></div>
    <span id="s3-tagline" class="clip s3-tagline" data-start="0.4" data-duration="5.1" data-track-index="2">Bắt đầu ngay hôm nay</span>
    <div  id="s3-cta"     class="clip s3-cta"     data-start="0.9" data-duration="4.6" data-track-index="3">THỬ CHATGPT<br>CHO CONTENT</div>
    <div  id="s3-badge"   class="clip s3-badge"   data-start="2.0" data-duration="3.5" data-track-index="4">
      <div class="s3-badge-inner">
        <span class="s3-icon">⚡</span> Miễn phí <span style="color:rgba(57,255,20,0.5)">·</span> 5 phút setup <span class="s3-icon">⚡</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 5.5;
      const tl = gsap.timeline({ paused: true });

      // fluid — power2.inOut, gentle flow
      tl.from('#s3-halo',    { opacity: 0, scale: 0.5, transformOrigin: 'center', duration: 1.2, ease: 'power2.out'   }, 0.1);
      tl.from('#s3-tagline', { opacity: 0, y: 16,                                 duration: 0.65, ease: 'power2.inOut' }, 0.4);
      tl.from('#s3-cta',     { opacity: 0, y: 28,                                 duration: 0.75, ease: 'power2.inOut' }, 0.9);
      tl.from('#s3-badge',   { opacity: 0, y: 20,                                 duration: 0.6,  ease: 'power2.inOut' }, 2.0);

      // halo breathe
      const haloReps = Math.ceil(DURATION / 2.5);
      tl.to('#s3-halo',  { scale: 1.12, opacity: 0.7, transformOrigin: 'center', duration: 1.25, ease: 'sine.inOut', repeat: haloReps, yoyo: true }, 1.5);

      // badge pulse — focal moment tại 2.5s
      const badgeReps = Math.ceil((DURATION - 2.5) / 1.8);
      tl.to('#s3-badge', { scale: 1.03, transformOrigin: 'center', duration: 0.9, ease: 'sine.inOut', repeat: badgeReps, yoyo: true }, 2.5);

      // fade to black — final scene
      tl.to('#scene-03', { opacity: 0, duration: 0.8, ease: 'power2.in' }, 4.7);

      window.__timelines['scene-03'] = tl;
    </script>
  </div>
</template>
