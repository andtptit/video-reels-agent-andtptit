      .s5-badge {

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 6;
      const tl = gsap.timeline({ paused: true });

      // fluid — power2.inOut, gentle flow
      tl.from('#s5-halo',    { opacity: 0, scale: 0.5, transformOrigin: 'center', duration: 1.2, ease: 'power2.out' }, 0.1);
      tl.from('#s5-tagline', { opacity: 0, y: 16, duration: 0.65, ease: 'power2.inOut' }, 0.4);
      tl.from('#s5-cta',     { opacity: 0, y: 28, duration: 0.75, ease: 'power2.inOut' }, 0.9);

      // halo breathe
      const haloReps = Math.ceil(DURATION / 2.5);
      tl.to('#s5-halo', { scale: 1.12, opacity: 0.7, transformOrigin: 'center', duration: 1.25, ease: 'sine.inOut', repeat: haloReps, yoyo: true }, 1.5);

      // badge pulse
      const badgeReps = Math.ceil((DURATION - 2.5) / 1.8);
      tl.to('#s5-badge', { scale: 1.03, transformOrigin: 'center', duration: 0.9, ease: 'sine.inOut', repeat: badgeReps, yoyo: true }, 2.5);

      // final scene: gentle fade to black

      window.__timelines['scene-05'] = tl;
