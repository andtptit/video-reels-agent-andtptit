    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 9.5;
      const tl = gsap.timeline({ paused: true });

      // technical — top-to-bottom, logical order
      tl.from('#s2-badge',  { opacity: 0, y: -80, duration: 0.55, ease: 'expo.out' }, 0.2);
      tl.from('#s2-ring-2', { opacity: 0, scale: 0.4, transformOrigin: 'center', duration: 0.8,  ease: 'expo.out' }, 0.3);
      tl.from('#s2-ring-1', { opacity: 0, scale: 0.5, transformOrigin: 'center', duration: 0.65, ease: 'expo.out' }, 0.42);
      tl.from('#s2-node',   { opacity: 0, scale: 0,   transformOrigin: 'center', duration: 0.6,  ease: 'back.out(2.2)' }, 0.35);

      // ring pulse
      const ringPulse = Math.ceil(DURATION / 2.4);
      tl.to('#s2-ring-1', { scale: 1.06, opacity: 0.55, transformOrigin: 'center', duration: 1.2, ease: 'sine.inOut', repeat: ringPulse, yoyo: true, overwrite: 'auto' }, 1.3);
      tl.to('#s2-ring-2', { scale: 1.10, opacity: 0.32, transformOrigin: 'center', duration: 1.7, ease: 'sine.inOut', repeat: Math.ceil(DURATION / 3.4), yoyo: true, overwrite: 'auto' }, 1.6);

      // SVG line draw-on
      tl.set('#s2-dot-c',  { opacity: 1 }, 1.4);
      tl.to('#s2-line-l',  { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, 1.45);
      tl.to('#s2-line-r',  { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, 1.65);
      tl.set('#s2-dot-l',  { opacity: 1 }, 2.15);
      tl.set('#s2-dot-r',  { opacity: 1 }, 2.35);

      // cards rise in
      tl.from('#s2-card-l', { y: 65, opacity: 0, duration: 0.6, ease: 'expo.out' }, 2.5);
      tl.from('#s2-card-r', { y: 65, opacity: 0, duration: 0.6, ease: 'expo.out' }, 2.72);

      // ding pulse at 3.2s (per sfx_picks)
      tl.to('#s2-node', { scale: 1.08, transformOrigin: 'center', duration: 0.14, ease: 'power2.out'         }, 3.2);
      tl.to('#s2-node', { scale: 1.00, transformOrigin: 'center', duration: 0.32, ease: 'elastic.out(1,0.5)', overwrite: 'auto' }, 3.34);

      // card glow pulse
      const cardPulse = Math.ceil((DURATION - 3.8) / 2.2);
      tl.to('#s2-card-l', { boxShadow: '0 0 44px rgba(57,255,20,0.38), 0 0 72px rgba(57,255,20,0.16)', duration: 1.1, ease: 'sine.inOut', repeat: cardPulse, yoyo: true }, 3.8);

      window.__timelines['scene-02'] = tl;
