<template id="scene-03-template">
  <div id="scene-03" data-composition-id="scene-03" data-width="1920" data-height="1080">
    <style>
      #scene-03 {
        position: absolute; inset: 0; overflow: hidden;
        font-family: 'Exo 2', 'Inter', sans-serif;
      }
      .s3-title {
        position: absolute; top: 300px; left: 0; width: 1920px;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 18px; font-weight: 600;
        color: rgba(57,255,20,0.65); letter-spacing: 7px; text-transform: uppercase;
      }
      /* Step cards */
      .s3-step {
        position: absolute; top: 360px;
        width: 370px; height: 300px;
        border-radius: 16px;
        background: rgba(8,12,24,0.9);
        border: 2px solid rgba(57,255,20,0.5);
        box-shadow: 0 0 24px rgba(57,255,20,0.14), inset 0 0 16px rgba(57,255,20,0.03);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 28px;
      }
      .s3-step-1 { left: 194px; }
      .s3-step-2 { left: 775px; }
      .s3-step-3 { left: 1356px; }
      .s3-step-num {
        font-size: 64px; font-weight: 900; color: #39FF14; line-height: 1;
        text-shadow: 0 0 24px rgba(57,255,20,0.7); letter-spacing: -2px;
      }
      .s3-step-icon { font-size: 40px; line-height: 1; }
      .s3-step-label {
        font-size: 22px; font-weight: 800; color: #fff;
        text-align: center; letter-spacing: 1px; text-transform: uppercase; line-height: 1.2;
      }
      /* Arrows between steps */
      .s3-arrow {
        position: absolute; top: 490px;
        width: 80px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; color: rgba(57,255,20,0.7);
      }
      .s3-arrow-1 { left: 584px; }
      .s3-arrow-2 { left: 1165px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <span id="s3-title"   class="clip s3-title"   data-start="0.1" data-duration="9.4" data-track-index="1">3 BƯỚC ĐỂ BẮT ĐẦU</span>
    <div  id="s3-step-1"  class="clip s3-step s3-step-1" data-start="0.5" data-duration="9.0" data-track-index="2">
      <span class="s3-step-num">01</span>
      <span class="s3-step-icon">✏️</span>
      <span class="s3-step-label">Nhập ý tưởng</span>

    <div  id="s3-arrow-1" class="clip s3-arrow s3-arrow-1" data-start="1.1" data-duration="8.4" data-track-index="3">→</div>
    <div  id="s3-step-2"  class="clip s3-step s3-step-2" data-start="1.5" data-duration="8.0" data-track-index="4">

      <span class="s3-step-icon">✅</span>
      <span class="s3-step-label">Nhận kết quả</span>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 9.5;
      const tl = gsap.timeline({ paused: true });

      // snappy — back.out(2), fast stagger, each step pops in
      tl.from('#s3-title',   { opacity: 0, y: -24, duration: 0.45, ease: 'expo.out' }, 0.1);
      tl.from('#s3-step-1',  { opacity: 0, y: 50, scale: 0.88, transformOrigin: 'center bottom', duration: 0.5, ease: 'back.out(2)' }, 0.5);
      tl.from('#s3-arrow-1', { opacity: 0, x: -20, duration: 0.35, ease: 'expo.out' }, 1.1);
      tl.from('#s3-step-2',  { opacity: 0, y: 50, scale: 0.88, transformOrigin: 'center bottom', duration: 0.5, ease: 'back.out(2)' }, 1.5);
      tl.from('#s3-arrow-2', { opacity: 0, x: -20, duration: 0.35, ease: 'expo.out' }, 2.1);
      tl.from('#s3-step-3',  { opacity: 0, y: 50, scale: 0.88, transformOrigin: 'center bottom', duration: 0.5, ease: 'back.out(2)' }, 2.5);

      // step-2 shimmer to suggest processing
      const shimmerReps = Math.ceil((DURATION - 2) / 1.6);
      tl.to('#s3-step-2', { boxShadow: '0 0 40px rgba(57,255,20,0.35), 0 0 70px rgba(57,255,20,0.15)', duration: 0.8, ease: 'sine.inOut', repeat: shimmerReps, yoyo: true }, 2.2);

      window.__timelines['scene-03'] = tl;
    </script>
